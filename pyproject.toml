[project]
name = "tuf"
version = "0.1.0"
description = "TUF: personal expense analytics and budgeting from Splitwise data, delivered to a Notion dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "TUF contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]

[project.scripts]
tuf = "tuf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: requires real credentials; skipped unless TUF_LIVE_TESTS=1"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["tuf"]
ignore_missing_imports = true
